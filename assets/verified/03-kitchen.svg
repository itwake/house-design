<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="厨房按比例空间校核图">
<style>
  .title{font:800 31px system-ui,'Microsoft YaHei';fill:#16342e} .sub{font:500 16px system-ui,'Microsoft YaHei';fill:#65706b}
  .dim{font:700 15px system-ui,'Microsoft YaHei';fill:#087567} .fixture{font:700 11px system-ui,'Microsoft YaHei';fill:#183b34}
  .door-label{font:700 12px system-ui,'Microsoft YaHei';fill:#a44925} .window-label{font:700 12px system-ui,'Microsoft YaHei';fill:#1c7488} .note{font:600 15px system-ui,'Microsoft YaHei';fill:#31423d}
  .status{font:800 18px system-ui,'Microsoft YaHei';fill:#fff} .meta{font:600 14px system-ui,'Microsoft YaHei';fill:#6a746f}
</style>
<rect width="1100" height="650" fill="#f5f1e8"/><text x="55" y="57" class="title">厨房</text>
<text x="55" y="87" class="sub">净尺寸约2870×2620 · 7.5㎡模型值</text>
<rect x="35" y="108" width="580" height="500" rx="24" fill="#fffdfa" stroke="#ddd6c9"/>
<polygon points="89.5,145.0 560.5,145.0 560.5,575.0 89.5,575.0" fill="#eee1cd" stroke="#193a33" stroke-width="9" stroke-linejoin="round"/>
<rect x="89.5" y="245.1" width="147.7" height="126.4" fill="#e5a46a" fill-opacity=".12" stroke="#c25d31" stroke-width="2" stroke-dasharray="8 6"/><text x="163.3" y="308.3" text-anchor="middle" dominant-baseline="middle" class="door-label">厨房门内落脚区</text><rect x="89.5" y="476.5" width="471.0" height="98.5" rx="6" fill="#b9aa95" stroke="#183b34" stroke-width="2"/><text x="325.0" y="525.8" text-anchor="middle" dominant-baseline="middle" class="fixture">南侧地柜</text><rect x="168.3" y="145.0" width="392.3" height="98.5" rx="6" fill="#b9aa95" stroke="#183b34" stroke-width="2"/><text x="364.4" y="194.2" text-anchor="middle" dominant-baseline="middle" class="fixture">北侧地柜</text><rect x="455.5" y="245.1" width="98.5" height="114.9" rx="6" fill="#59615e" stroke="#183b34" stroke-width="2"/><text x="504.7" y="302.6" text-anchor="middle" dominant-baseline="middle" class="fixture">冰箱高柜</text><rect x="455.5" y="361.6" width="98.5" height="114.9" rx="6" fill="#b9aa95" stroke="#183b34" stroke-width="2"/><text x="504.7" y="419.1" text-anchor="middle" dominant-baseline="middle" class="fixture">蒸烤高柜</text><line x1="89.5" y1="223.8" x2="89.5" y2="371.5" stroke="#f7f4ed" stroke-width="12"/><line x1="89.5" y1="223.8" x2="89.5" y2="371.5" stroke="#c25d31" stroke-width="4" stroke-dasharray="10 6"/><text x="89.5" y="288.6" text-anchor="middle" class="door-label">移门900</text>
<line x1="89.5" y1="121.0" x2="560.5" y2="121.0" stroke="#087567" stroke-width="2"/>
<text x="325.0" y="111.0" text-anchor="middle" class="dim">2870 mm</text>
<line x1="65.5" y1="145.0" x2="65.5" y2="575.0" stroke="#087567" stroke-width="2"/>
<text x="52.5" y="360.0" transform="rotate(-90 52.5 360.0)" text-anchor="middle" class="dim">2620 mm</text>
<text x="55" y="633" class="meta">模型净面积 7.5㎡ · 家具投影与Sweet Home 3D使用同一厘米坐标</text>
<rect x="650" y="115" width="410" height="94" rx="18" fill="#123c35"/><text x="675" y="151" class="status">平面校核结论</text>
<text x="675" y="184" class="status">成立（双排柜净通道约1360）</text>
<text x="665" y="258" class="title" style="font-size:23px">成立条件 / 风险</text><g transform="translate(665 330)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">两排台面均按600深校核</text></g><g transform="translate(665 404)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">冰箱与蒸烤高柜集中东墙</text></g><g transform="translate(665 478)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">烟道、燃气表和下水位置待复尺后再排序</text></g>
<text x="665" y="585" class="meta">家具＝按比例固定投影 · 青线＝外窗</text><text x="665" y="611" class="meta">橙色虚线＝门洞 / 必须保持的通行净空</text>
</svg>