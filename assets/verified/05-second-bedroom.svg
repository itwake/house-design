<line x1="92.2" y1="145.0" x2="92.2" y2="575.0" stroke="#087567" stroke-width="2"/>
<text x="79.2" y="360.0" transform="rotate(-90 79.2 360.0)" text-anchor="middle" class="dim">3100 mm</text>
