<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="家政阳台按比例空间校核图">
<style>
  .title{font:800 31px system-ui,'Microsoft YaHei';fill:#16342e} .sub{font:500 16px system-ui,'Microsoft YaHei';fill:#65706b}
  .dim{font:700 15px system-ui,'Microsoft YaHei';fill:#087567} .fixture{font:700 11px system-ui,'Microsoft YaHei';fill:#183b34}
  .door-label{font:700 12px system-ui,'Microsoft YaHei';fill:#a44925} .note{font:600 15px system-ui,'Microsoft YaHei';fill:#31423d}
  .status{font:800 18px system-ui,'Microsoft YaHei';fill:#fff} .meta{font:600 14px system-ui,'Microsoft YaHei';fill:#6a746f}
</style>
<rect width="1100" height="650" fill="#f5f1e8"/><text x="55" y="57" class="title">家政阳台</text>
<text x="55" y="87" class="sub">净尺寸约1420×1490 · 2.1㎡模型值</text>
<rect x="35" y="108" width="580" height="500" rx="24" fill="#fffdfa" stroke="#ddd6c9"/>
<polygon points="120.1,145.0 529.9,145.0 529.9,575.0 120.1,575.0" fill="#eee1cd" stroke="#193a33" stroke-width="9" stroke-linejoin="round"/>
<rect x="120.1" y="145.0" width="222.2" height="329.0" fill="#e5a46a" fill-opacity=".12" stroke="#c25d31" stroke-width="2" stroke-dasharray="8 6"/><text x="231.2" y="309.5" text-anchor="middle" dominant-baseline="middle" class="door-label">主通道</text><rect x="342.3" y="145.0" width="187.6" height="202.0" rx="6" fill="#59615e" stroke="#183b34" stroke-width="2"/><text x="436.1" y="246.0" text-anchor="middle" dominant-baseline="middle" class="fixture">洗烘塔</text><rect x="120.1" y="474.0" width="202.0" height="101.0" rx="6" fill="#b9aa95" stroke="#183b34" stroke-width="2"/><text x="221.1" y="524.5" text-anchor="middle" dominant-baseline="middle" class="fixture">阳台家政柜</text><line x1="120.1" y1="145.0" x2="120.1" y2="560.6" stroke="#f7f4ed" stroke-width="12"/><line x1="120.1" y1="145.0" x2="120.1" y2="560.6" stroke="#c25d31" stroke-width="4" stroke-dasharray="10 6"/><text x="120.1" y="343.8" text-anchor="middle" class="door-label">推拉门约1500</text>
<line x1="120.1" y1="121.0" x2="529.9" y2="121.0" stroke="#087567" stroke-width="2"/>
<text x="325.0" y="111.0" text-anchor="middle" class="dim">1420 mm</text>
<line x1="96.1" y1="145.0" x2="96.1" y2="575.0" stroke="#087567" stroke-width="2"/>
<text x="83.1" y="360.0" transform="rotate(-90 83.1 360.0)" text-anchor="middle" class="dim">1490 mm</text>
<text x="55" y="633" class="meta">模型净面积 2.1㎡ · 家具投影与Sweet Home 3D使用同一厘米坐标</text>
<rect x="650" y="115" width="410" height="94" rx="18" fill="#123c35"/><text x="675" y="151" class="status">平面校核结论</text>
<text x="675" y="184" class="status">成立（柜体已移出主通道）</text>
<text x="665" y="258" class="title" style="font-size:23px">成立条件 / 风险</text><g transform="translate(665 330)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">洗烘塔650×700放东北角</text></g><g transform="translate(665 404)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">南墙仅放700×350浅柜</text></g><g transform="translate(665 478)"><circle cx="10" cy="-5" r="5" fill="#087567"/><text x="28" y="0" class="note">西侧主通道最窄约775；窗扇和地漏待复尺</text></g>
<text x="665" y="585" class="meta">绿色家具＝按比例固定投影</text><text x="665" y="611" class="meta">橙色虚线＝门洞 / 必须保持的通行净空</text>
</svg>